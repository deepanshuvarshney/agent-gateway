[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gateway"
version = "0.1.0"
description = "OpenAI-compatible LLM gateway with smart routing, semantic caching, and guardrails."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Deepanshu Varshney" }]
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2.50",
    "opentelemetry-api>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-sdk>=1.27",
    "prometheus-client>=0.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
embeddings = ["sentence-transformers>=3.0"]
dev = [
    "fakeredis>=2.26",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[project.scripts]
agent-gateway = "gateway.main:main"
gateway-benchmark = "gateway.benchmark.harness:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gateway = ["dashboard/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=gateway --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["gateway"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["gateway"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
packages = ["gateway"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "langgraph.*",
    "opentelemetry.*",
    "prometheus_client.*",
    "redis.*",
    "sentence_transformers",
]
ignore_missing_imports = true
